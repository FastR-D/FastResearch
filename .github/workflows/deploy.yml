name: Deploy FastResearch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fastresearch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LIVE_ROOT: /home/dev/FastResearch
      RELEASES_ROOT: /home/dev/ci-releases/fastresearch
      UNIT: fastresearch.service
      VITE_API_URL: ""
      VITE_READ_URL: "https://47.110.133.67:3015"
      VITE_WRITE_URL: ""
      VITE_FASTTASK_URL: ""
      VITE_FASTNEWS_URL: "http://47.110.133.67/news/"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Patch production server
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path("patch_research_server.py").write_bytes(base64.b64decode(""))
          import patch_research_server
          patch_research_server.patch_tree(Path("."))
          print("patched FastResearch server and package.json start script")
          PY

      - name: Pack release
        run: |
          rm -rf /tmp/fr-rel
          mkdir -p /tmp/fr-rel
          cp -a dist server package.json package-lock.json /tmp/fr-rel/
          tar -C /tmp/fr-rel -czf /tmp/fastresearch.tar.gz .
          ls -lh /tmp/fastresearch.tar.gz

      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          [ -n "$DEPLOY_HOST" ] || { echo "missing secret DEPLOY_HOST"; missing=1; }
          [ -n "$DEPLOY_USER" ] || { echo "missing secret DEPLOY_USER"; missing=1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "missing secret DEPLOY_SSH_KEY"; missing=1; }
          exit "$missing"

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            echo "Host deploy"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile $HOME/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Upload and apply
        env:
          RELEASE_ID: research-${{ github.run_id }}-${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path("/tmp/ci-sync-release.py").write_bytes(base64.b64decode(""))
          Path("/tmp/ci-health.py").write_bytes(base64.b64decode(""))
          Path("/tmp/ci-apply.py").write_bytes(base64.b64decode(""))
          print("wrote remote helpers")
          PY
          scp /tmp/ci-sync-release.py /tmp/ci-health.py /tmp/ci-apply.py deploy:/tmp/

          RELEASE_DIR="$RELEASES_ROOT/$RELEASE_ID"
          BACKUP_DIR="$RELEASES_ROOT/backups/$RELEASE_ID"
          ssh deploy "mkdir -p '$RELEASE_DIR/extract' '$RELEASES_ROOT/backups'"
          scp /tmp/fastresearch.tar.gz deploy:"$RELEASE_DIR/release.tar.gz"
          ssh deploy "python3 /tmp/ci-apply.py '$RELEASE_DIR/release.tar.gz' '$RELEASE_DIR/extract' '$LIVE_ROOT' '$BACKUP_DIR' '$RELEASES_ROOT' '.git,.env,.env.local,.env.production,data,node_modules' 'dist,server' keep '$UNIT' 'http://127.0.0.1:8787/api/health' 'http://127.0.0.1:8787/' 'http://127.0.0.1/'"
