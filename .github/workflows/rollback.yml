name: Roll back FastResearch

on:
  workflow_dispatch:
    inputs:
      expected-release:
        description: Current release ID from the successful deployment log
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    uses: FastR-D/FastDeploy/.github/workflows/rollback.yml@dcea811cbab5ff02926cec768ddcb0eef0e40e74
    with:
      app: fastresearch
      expected-release: ${{ inputs.expected-release }}
    secrets:
      SSH_HOST: ${{ secrets.FASTRD_SSH_HOST }}
      SSH_PORT: ${{ secrets.FASTRD_SSH_PORT }}
      SSH_USER: ${{ secrets.FASTRD_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.FASTRD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.FASTRD_SSH_KNOWN_HOSTS }}
